name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Package Windows x64
        run: npm run package:win

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path release/LunarVowPet-win32-x64 -DestinationPath LunarVowPet-Windows-x64-v0.1.0.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVowPet-Windows-x64
          path: LunarVowPet-Windows-x64-v0.1.0.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.1.0 LunarVowPet-Windows-x64-v0.1.0.zip --clobber
          } else {
            gh release create v0.1.0 LunarVowPet-Windows-x64-v0.1.0.zip --target $env:GITHUB_SHA --title "LunarVowPet v0.1.0" --notes "Windows x64 便携版。完整解压后运行 LunarVowPet.exe。"
          }
