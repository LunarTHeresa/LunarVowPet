name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Package Windows x64
        run: npm run package:win

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path release/LunarVowPet-win32-x64 -DestinationPath LunarVowPet-Windows-x64-${{ github.ref_name }}.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVowPet-Windows-x64
          path: LunarVowPet-Windows-x64-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LunarVowPet-Windows-x64-${{ github.ref_name }}.zip
          generate_release_notes: true
