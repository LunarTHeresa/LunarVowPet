name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Package Windows x64
        run: npm run package:win

      - name: Read release metadata
        id: metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "zip=LunarVowPet-Windows-x64-v$version.zip" >> $env:GITHUB_OUTPUT

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path release/LunarVowPet-win32-x64 -DestinationPath "${{ steps.metadata.outputs.zip }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVowPet-Windows-x64
          path: ${{ steps.metadata.outputs.zip }}

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.metadata.outputs.tag }}"
          $zip = "${{ steps.metadata.outputs.zip }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "LunarVowPet $tag" --notes "重做为 16 帧淑女小步动画，使用距离同步帧序列并统一角色锚点；新增独立待机立绘、自然停步和边缘转身停顿，同时继续修复拖拽与跨屏限制。保留自定义人设、缩放、提醒及 OpenAI 兼容 API。完整解压后运行 LunarVowPet.exe。"
          }
