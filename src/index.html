<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>月下誓约桌宠</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel-window">
    <main id="stage">
      <section id="panel" class="panel" aria-label="月下助手">
        <header class="panel-head">
          <strong>月下的小屋</strong>
          <button id="close-panel" class="icon-button" aria-label="关闭">×</button>
        </header>
        <nav class="tabs">
          <button data-tab="chat" class="active">聊天</button>
          <button data-tab="reminders">提醒</button>
          <button data-tab="settings">设置</button>
        </nav>
        <div id="tab-chat" class="tab active">
          <div id="messages" class="messages"><p class="assistant">晚上好。想和我说些什么？</p></div>
          <form id="chat-form" class="composer">
            <input id="chat-input" maxlength="500" placeholder="和月下说话…" autocomplete="off" />
            <button type="submit">发送</button>
          </form>
        </div>
        <div id="tab-reminders" class="tab">
          <form id="reminder-form" class="stack">
            <input id="reminder-text" maxlength="80" placeholder="提醒内容" required />
            <input id="reminder-when" type="datetime-local" required />
            <button type="submit">添加提醒</button>
          </form>
          <div id="reminder-list" class="reminder-list"></div>
        </div>
        <div id="tab-settings" class="tab">
          <form id="settings-form" class="stack">
            <label class="switch-row"><span>始终置顶</span><input id="always-on-top" type="checkbox" /></label>
            <label class="switch-row"><span>开机自启</span><input id="launch-at-login" type="checkbox" /></label>
            <label>服务预设
              <select id="provider-preset">
                <option value="custom">自定义 / 其他兼容服务</option>
                <option value="openai">OpenAI</option>
                <option value="deepseek">DeepSeek</option>
                <option value="gemini">Google Gemini</option>
              </select>
            </label>
            <label>API Base URL<input id="base-url" placeholder="https://api.openai.com/v1" /></label>
            <label>AI 模型<input id="model" value="gpt-4.1-mini" /></label>
            <label>角色人设<textarea id="persona" maxlength="2000" rows="5" placeholder="描述角色的性格、说话方式以及与你的关系"></textarea></label>
            <label>桌宠大小 <span id="scale-value" class="inline-value">100%</span><input id="pet-scale" type="range" min="50" max="150" step="5" value="100" /><span class="hint">拖动时实时预览，保存后才会记住尺寸</span></label>
            <label>API Key<input id="api-key" type="password" placeholder="留空则保持现有密钥" /></label>
            <p id="key-status" class="hint"></p>
            <div class="button-row"><button type="submit">保存</button><button type="button" id="clear-key" class="secondary">清除密钥</button></div>
          </form>
        </div>
        <p id="status" class="status"></p>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
